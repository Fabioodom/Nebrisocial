services:
  # ── PostgreSQL con extensión pgvector ──────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: nodal_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nodal_password_dev}
      POSTGRES_DB: nodal_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodal_user -d nodal_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── NATS Message Broker ────────────────────────────────────────────────────
  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    ports:
      - "4222:4222"   # Puerto de clientes
      - "8222:8222"   # Puerto de monitoreo HTTP
    command: ["--http_port", "8222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Agente Guardián (Clasificador Semántico de Duplicados) ─────────────────
  guardian:
    build:
      context: ./services/guardian
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./services/guardian/.env
    environment:
      NATS_URL: nats://nats:4222
      DATABASE_URL: postgresql://nodal_user:${DB_PASSWORD:-nodal_password_dev}@db:5432/nodal_db
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_healthy

volumes:
  db_data: